name: Reminder worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: reminder-worker
  cancel-in-progress: false

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run production reminder worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REMINDERS_URL: https://wowstorgwebapp.vercel.app/api/reminders/run
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "Repository secret CRON_SECRET is required"
            exit 1
          fi
          HTTP_STATUS="$(curl --silent --show-error --retry 3 --retry-all-errors \
            --output reminder-response.json \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            -H "User-Agent: wowstorg-reminder-worker" \
            -X POST "$REMINDERS_URL")"
          echo "Reminder endpoint returned HTTP $HTTP_STATUS"
          if [ -s reminder-response.json ]; then
            head -c 2000 reminder-response.json
            echo
          fi
          case "$HTTP_STATUS" in
            2??) ;;
            *) exit 1 ;;
          esac
